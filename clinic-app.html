<style>:root{
  --navy:#0B2545; --navy2:#143A63; --navy3:#1E4E7F;
  --gold:#C9A227; --gold2:#E0C36A; --gold3:#F3E6BC;
  --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E8EF; --line2:#EDF1F6;
  --ink:#132339; --ink2:#4B5C74; --ink3:#8494A9;
  --ok:#0E7C57; --okbg:#E6F4EE; --warn:#B26A00; --warnbg:#FFF3E0;
  --bad:#B3261E; --badbg:#FDECEA; --info:#1E4E7F; --infobg:#E9F1F9;
  --r:14px; --r2:10px; --sh:0 1px 2px rgba(11,37,69,.06),0 6px 20px rgba(11,37,69,.06);
  --sh2:0 10px 40px rgba(11,37,69,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.ml{font-family:'Noto Sans Malayalam','Manjari','Meera',sans-serif}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--navy3);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd8e3;border-radius:8px;border:3px solid var(--bg)}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:linear-gradient(175deg,var(--navy) 0%,#081C36 100%);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
#side .brand{padding:14px 12px 12px;border-bottom:1px solid rgba(255,255,255,.09)}
.logochip{background:#fff;border-radius:12px;padding:11px 12px;display:flex;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.28)}
.logochip img{width:100%;max-width:186px;display:block}
#side .brand .sub2{font-size:10px;color:var(--gold2);letter-spacing:.16em;text-transform:uppercase;
  text-align:center;margin-top:9px;font-weight:700}
#who{padding:8px 12px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#B9C9DC;
  display:flex;align-items:center;gap:8px}
#who b{color:#fff}
#who .out{margin-left:auto;cursor:pointer;color:var(--gold2);font-weight:700;font-size:11.5px}
.permgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:4px}
.permgrid label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px;color:var(--ink);
  margin:0;padding:5px 8px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.permgrid label:hover{background:#F6F9FC}
.permgrid input{width:auto;margin:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--gold)}
#nav{padding:10px 8px;overflow:auto;flex:1}
.navgrp{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7F93AC;padding:14px 10px 6px;font-weight:700}
.navi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:#D6E0EC;cursor:pointer;
  font-size:14px;font-weight:500;margin-bottom:1px;user-select:none}
.navi:hover{background:rgba(255,255,255,.07);color:#fff}
.navi.on{background:var(--gold);color:#25200A;font-weight:700}
.navi .ic{width:18px;text-align:center;font-size:15px;opacity:.95}
.navi .kb{margin-left:auto;font-size:10px;opacity:.45;border:1px solid currentColor;border-radius:4px;padding:0 4px}
#side .foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8CA2BC}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:#fff;border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:30}
#top h1{font-size:19px}
#top .sub{font-size:12px;color:var(--ink3);margin-top:1px}
.spacer{flex:1}
#view{padding:20px;max-width:1400px;width:100%}
#burger{display:none}

/* ---------- Bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:1.3fr 1fr;align-items:start}
.split.wide{grid-template-columns:1fr 320px}
@media(max-width:900px){.split,.split.wide{grid-template-columns:1fr}
  .split>div[style*="sticky"],.split .card[style*="sticky"]{position:static !important}}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:1px solid var(--navy);
  padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241E05}
.btn.gold:hover{background:#B8912098}
.btn.gold:hover{background:#D9B43C}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{background:#F2F5F9}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--line2);color:var(--ink2)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}
.chip.gold{background:#FBF3D9;color:#8A6D08}
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid #D6DEE8;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(30,78,127,.12)}
input[readonly]{background:#F4F6F9;color:var(--ink2)}
.f{margin-bottom:12px}
.hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD;position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:hover td{background:#FBFCFE}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-width:100%;max-height:64vh;border-radius:var(--r)}
/* grid/flex children default to min-width:auto — a wide table would otherwise
   push the whole page sideways instead of scrolling inside its own card */
.grid>*,.row>*,.board>*{min-width:0}
.card{max-width:100%}
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty .big{font-size:40px;margin-bottom:8px;opacity:.5}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:3px}
.kpi.acc{border-left:4px solid var(--gold)}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--navy3);border-radius:6px}
.alert{padding:11px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.alert.w{background:var(--warnbg);color:#7A4A00;border:1px solid #F0DDBB}
.alert.e{background:var(--badbg);color:#8C1D18;border:1px solid #F3C9C5}
.alert.i{background:var(--infobg);color:#123A63;border:1px solid #CBDDEE}
.alert.s{background:var(--okbg);color:#0A5C41;border:1px solid #BFE3D4}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tab{padding:9px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.sec{margin-bottom:20px}
.sec>h2{font-size:15px;margin-bottom:10px;color:var(--ink)}

/* modal */
#mo{position:fixed;inset:0;background:rgba(9,22,40,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:26px 14px;overflow:auto;backdrop-filter:blur(2px)}
#mo.on{display:flex}
#mo .box{background:#fff;border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:640px;overflow:hidden;animation:pop .16s ease}
#mo .box.wide{max-width:940px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#mo .hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#mo .hd h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
#mo .bd{padding:18px;max-height:70vh;overflow:auto}
#mo .ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#FAFBFD}
.x{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink3);line-height:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:var(--sh2);font-size:14px;font-weight:600;animation:pop .16s}
.tst.ok{background:var(--ok)}.tst.bad{background:var(--bad)}.tst.warn{background:var(--warn)}

/* billing */
.svcpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.svcbtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left}
.svcbtn:hover{border-color:var(--navy3);background:#F6F9FC}
.svcbtn b{display:block;font-size:13px;line-height:1.25}
.svcbtn small{color:var(--ink3);font-size:11.5px}
.svcbtn .p{color:var(--navy);font-weight:800;font-size:13.5px;margin-top:3px}
.lines td{padding:6px 8px}
.lines input{padding:6px 8px;border-radius:8px}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.tot.big{font-size:20px;font-weight:800;border-top:2px solid var(--navy);margin-top:7px;padding-top:9px}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;background:#fff}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0B2545,#061527);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff}
.lock img{height:64px;margin-bottom:6px}
.lock input{max-width:230px;text-align:center;font-size:26px;letter-spacing:.4em;padding:12px}

/* print */
#print{display:none}
@media print{
  #app,#mo,#toast,#lockscr,.noprint{display:none !important}
  #print{display:block !important}
  html,body{background:#fff !important;margin:0;padding:0}
}
.doc{width:100%;margin:0 auto;color:#000;font-size:12.5px}
.doc .dhd{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:8px}
.doc .dhd img{height:50px}
.doc .dhd .t{font-size:11px;line-height:1.4;flex:1}
.doc h2{text-align:center;font-size:14px;letter-spacing:.16em;margin:9px 0 7px;text-transform:uppercase}
.doc table{font-size:12px;width:100%}
.doc th{background:#EDF1F6;color:#000;border-bottom:1px solid #999;position:static;padding:5px 7px}
.doc td{border-bottom:1px solid #DDD;padding:5px 7px}
.doc .sign{margin-top:20px;display:flex;justify-content:space-between;font-size:11px}
.doc .fine{font-size:9.5px;color:#333;margin-top:8px;line-height:1.4;border-top:1px dashed #bbb;padding-top:5px}
.doc .meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin:6px 0 8px}
.doc .tot{width:56%;margin-left:44%}
body.thermal .doc{font-size:10.5px}
body.thermal .doc .dhd{display:block;text-align:center}
body.thermal .doc .dhd img{height:34px;margin-bottom:3px}
body.thermal .doc .meta{display:block}
body.thermal .doc .tot{width:100%;margin-left:0}
body.thermal .doc table{font-size:10px}
body.thermal .doc .sign{display:none}

/* queue board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.col{background:#EEF2F7;border:1px solid var(--line);border-radius:var(--r);padding:11px;min-height:120px}
.col>h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin-bottom:9px;
  display:flex;align-items:center;gap:7px}
.col>h4 .n{background:var(--navy);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh)}
.pcard.hot{border-left:4px solid var(--gold)}
.pcard b{font-size:14.5px}
.pcard .m{font-size:12px;color:var(--ink3);margin:2px 0 8px}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.tk{font-size:22px;font-weight:800;color:var(--navy3);float:right;line-height:1}
.pwrap{position:relative}
.lock{padding:24px 16px}
.signbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;
  padding:20px 18px 16px;width:100%;max-width:340px;backdrop-filter:blur(4px)}
.signbox label.lk{color:#CFE0F2;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.lock input,.lock input[type=text],.lock input[type=password]{width:100%;max-width:none;text-align:left;
  font-size:16px;letter-spacing:normal;padding:13px 14px;border-radius:11px;border:1px solid #3A5D86;
  background:#fff !important;color:#132339 !important;-webkit-text-fill-color:#132339;caret-color:#0B2545}
.lock .pwrap input{padding-right:76px}
.lock input::placeholder{color:#8494A9;opacity:1}
.lock input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.35)}
.eyebtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#EDF1F6;border:1px solid #D6DEE8;
  color:#1E4E7F;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.eyebtn:hover{background:#E2E9F2}
.lkerr{color:#FFB4AE;font-size:13px;min-height:18px;margin-top:8px;text-align:center;font-weight:600}
.capsw{color:var(--gold2);font-size:12px;min-height:14px;text-align:center}
.firsttime{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.2);
  font-size:13px;color:#CFE0F2;text-align:center;line-height:1.6}
.firsttime b{color:var(--gold2);font-size:15px;letter-spacing:.04em}
.lkfoot{font-size:11.5px;opacity:.55;max-width:300px;text-align:center;margin-top:14px;line-height:1.5}
.rx td{padding:4px 6px}
.rx input,.rx select{padding:6px 8px;border-radius:8px;font-size:13px}

@media(max-width:1100px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  #side{position:fixed;left:-240px;transition:left .18s}
  #side.open{left:0;box-shadow:var(--sh2)}
  #burger{display:inline-flex}
  #view{padding:14px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  #top h1{font-size:16px}
}

@media(max-width:1280px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.board{grid-template-columns:1fr}}
@media(max-width:640px){
  #view{padding:11px}
  #top{padding:9px 12px;gap:8px;flex-wrap:wrap}
  #burger{order:0}#top>div:not(.spacer):not(#topact){order:1}.spacer{order:2}#helpbtn{order:3}
  #topact{order:4;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:7px;padding:2px 0 1px;scrollbar-width:none}
  #topact::-webkit-scrollbar{display:none}
  #topact select,#topact input{width:auto;min-width:120px}
  #top h1{font-size:15px}#top .sub{display:none}
  #topact .btn{padding:8px 11px;font-size:13px}
  .card.pad{padding:13px}
  .kpi .v{font-size:21px}
  .btn{padding:10px 14px}
  .btn.sm{padding:7px 11px}
  input,select,textarea{font-size:16px}
  th,td{padding:8px 7px;font-size:12.5px}
  #mo{padding:0}

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){DB=JSON.parse(raw);migrate();return;}}catch(e){console.warn(e);}
  /* carry forward data saved by an earlier version of this app */
  for(const k of OLDKEYS){
    try{const old=localStorage.getItem(k);
      if(old){DB=JSON.parse(old);migrate();saveNow();
        setTimeout(()=>toast('Your earlier data was carried over','ok'),900);return;}
    }catch(e){}
  }
  DB=seedMasters(blankDB());save();
}
function migrate(){
  const b=blankDB();
  DB.settings=Object.assign({},b.settings,DB.settings||{});
  ['patients','services','bills','expenses','vendors','stockItems','stockMoves','assets','staff','payruns','notes','log','doctors','visits']
    .forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  DB.counters=DB.counters||{};delete DB.project;
  if(!DB.services.length)seedMasters(DB);
  /* single consume -> consumes[] */
  DB.services.forEach(s=>{
    if(!Array.isArray(s.consumes))s.consumes=s.consume?[{itemId:s.consume,qty:1}]:[];
    delete s.consume;});
  DB.staff.forEach(s=>{if(!s.perms)s.perms=Object.assign({},DEFAULT_PERMS);
    if(s.login===undefined)s.login=false;if(!s.pass)s.pass=s.pin||'';if(!s.user)s.user='';});
  DB.doctors.forEach(d=>{if(!d.perms)d.perms=Object.assign({},DOCTOR_PERMS);
    if(!d.kind)d.kind='doctor';});
  if(!DB.doctors.length)DB.doctors.push({id:'doc-owner',name:DB.settings.doctorName||'Dr. Dhanil Charly',
    qual:DB.settings.qualification||'',regNo:DB.settings.regNo||'',phone:'',isOwner:true,active:true,
    kind:'doctor',login:false,user:'',pass:'',perms:Object.assign({},DOCTOR_PERMS)});
}

  const s=DB.settings;let cash=Number(s.openingCash)||0,bank=Number(s.openingBank)||0;
  liveBills().forEach(b=>(b.payments||[]).forEach(p=>{
    if(p.d<s.openingDate)return;
    if(p.mode==='Cash')cash+=Number(p.amt)||0;else bank+=Number(p.amt)||0;}));
  DB.expenses.forEach(e=>{
    if(e.date<s.openingDate)return;
    if(e.mode==='Cash')cash-=Number(e.amount)||0;else bank-=Number(e.amount)||0;});
  return{cash:R(cash),bank:R(bank)};
}
function fyStats(fy){
  const [a,b]=fyRange(fy||DB.settings.fy);
  const rc=receiptsIn(a,b), bl=billsIn(a,b), ex=expIn(a,b);
  const cashRc=sum(rc.filter(r=>r.mode==='Cash'),r=>r.amt), allRc=sum(rc,r=>r.amt);
  const capex=sum(ex.filter(e=>e.capex),e=>e.amount), opex=sum(ex.filter(e=>!e.capex&&!/^Drawings|^Loan repayment/.test(e.head)),e=>e.amount);
  return{a,b,rc,bl,ex,billed:sum(bl,x=>x.net),collected:allRc,cashRc,
    cashPct:allRc?R(cashRc/allRc*100):0,capex,opex,surplus:R(allRc-opex)};
}

function rateOver(l){const s=svcById(l.sid);return DB.settings.rateLock&&s&&s.price>0&&R(l.rate)>R(s.price);}
function gstPreview(lines,gross,disc){
  const sp=splitTax(lines,gross,disc);let h='';
  if(sp.taxable.length){h+='<div class="tot"><span>Taxable value</span><b>'+money(sp.tv)+'</b></div>'+
    '<div class="tot"><span>CGST</span><b>'+money(sp.cgst)+'</b></div><div class="tot"><span>SGST</span><b>'+money(sp.sgst)+'</b></div>';}
  if(sp.exempt.length&&sp.taxable.length)h+='<div class="hint">This bill has both exempt and taxable items — it will print as <b>2 documents</b>: a Bill of Supply and a Tax Invoice.</div>';
  return h;
}
function splitTax(lines,gross,disc){
  const ex=[],tx=[];let tv=0,tax=0;
  lines.forEach(l=>{
    const share=gross>0?R(l.amt-disc*l.amt/gross):l.amt;
    const o=Object.assign({},l,{net:share});
    if(l.tax==='exempt'){ex.push(o);}
    else{const r=TAXCLASS[l.tax].rate;const t=R(share-share*100/(100+r));o.tv=R(share-t);o.tax=t;tv+=o.tv;tax+=t;tx.push(o);}
  });
  return{exempt:ex,taxable:tx,tv:R(tv),tax:R(tax),cgst:R(tax/2),sgst:R(tax/2)};
}
function addPay(){
  const amt=R($('#payamt').value);
  if(!CART.pmode){toast('Choose a payment mode','warn');return;}
  if(!amt){toast('Enter an amount','warn');return;}
  if(CART.pmode==='Cash'&&amt>=DB.settings.cashLimitRcpt){
    toast('Cash receipt of ₹2,00,000 or more is not allowed by law (Sec 269ST). Split to bank/UPI.','bad');return;}
  if(CART.pmode!=='Cash'&&!String(CART.pref||'').trim()&&DB.settings.needRef!==false){
    toast('Enter the '+(CART.pmode==='UPI'?'UPI reference number':'reference')+' — it is your proof the money came in','warn');
    const el=$('#payref');if(el)el.focus();return;}
  CART.pay.push({d:CART.date,mode:CART.pmode,amt:amt,ref:String(CART.pref||'').trim()});
  CART.payamt=null;CART.pref='';drawCart();
}
function resetCart(){CART={pid:'',pname:'',pphone:'',lines:[],disc:0,discMode:'rs',discPct:0,discReason:'',date:today(),note:'',pay:[],visitId:'',doctorId:''};refresh();}
function saveBill(doPrint){
  if(!CART.lines.length){toast('Add at least one service','warn');return;}
  if(!CART.pid){toast('Register the patient first — every bill needs a clinic ID','warn');return;}
  let gross=0;CART.lines.forEach(l=>{l.amt=R(l.qty*l.rate);gross+=l.amt;});gross=R(gross);
  const disc=cartDisc(gross);
  if(disc>0&&!CART.discReason.trim()){toast('Write why the discount is given — the CA will ask','warn');return;}
  const bad=CART.lines.filter(l=>rateOver(l)&&!String(l.over||'').trim());
  if(bad.length){toast('A rate is above the displayed rate card. Write the reason.','bad');return;}
  const sp=splitTax(CART.lines,gross,disc);
  const docs=[];
  const base={date:CART.date,time:nowT(),patientId:CART.pid,pname:CART.pname,pphone:CART.pphone,
    note:CART.note,discReason:CART.discReason,cancelled:false,created:new Date().toISOString(),
    doctorId:CART.doctorId||myDoctorId(),visitId:CART.visitId||'',by:USER.name};
  if(!DB.settings.gstEnabled){
    docs.push(Object.assign({},base,{id:uid(),type:'RCT',lines:CART.lines.slice(),gross:gross,disc:disc,
      net:R(gross-disc),tv:0,cgst:0,sgst:0,payments:[]}));
  }else{
    if(sp.exempt.length){const g=sum(sp.exempt,l=>l.amt),n=sum(sp.exempt,l=>l.net);
      docs.push(Object.assign({},base,{id:uid(),type:'BOS',lines:sp.exempt,gross:g,disc:R(g-n),net:n,tv:0,cgst:0,sgst:0,payments:[]}));}
    if(sp.taxable.length){const g=sum(sp.taxable,l=>l.amt),n=sum(sp.taxable,l=>l.net);
      docs.push(Object.assign({},base,{id:uid(),type:'TAX',lines:sp.taxable,gross:g,disc:R(g-n),net:n,
        tv:sum(sp.taxable,l=>l.tv),cgst:R(sum(sp.taxable,l=>l.tax)/2),sgst:R(sum(sp.taxable,l=>l.tax)/2),payments:[]}));}
  }
  docs.forEach(d=>d.no=nextNo(d.type));
  if(docs.length>1){const g=docs.map(d=>d.no).join(' + ');docs.forEach(d=>d.link=g);}
  /* distribute payments across docs, largest first */
  let pool=CART.pay.map(p=>Object.assign({},p));
  docs.forEach(d=>{let need=d.net;
    for(const p of pool){if(need<=0.01||p.amt<=0)continue;const take=Math.min(need,p.amt);
      d.payments.push({d:p.d,mode:p.mode,amt:R(take),ref:p.ref||''});p.amt=R(p.amt-take);need=R(need-take);}});
  docs.forEach(d=>DB.bills.push(d));
  /* close the visit */
  if(CART.visitId){const V=visitById(CART.visitId);
    if(V){V.status='billed';V.billId=docs[0].id;V.billNo=docs[0].no;}}
  /* medicines handed over come out of stock too */
  CART.lines.forEach(l=>{if(l.medItemId){const it=DB.stockItems.find(i=>i.id===l.medItemId);
    if(it){const have=stockQty(it.id),q=Math.min(l.qty,Math.max(0,have));
      if(q<l.qty)toast('Only '+Math.max(0,have)+' of '+it.name+' in stock — issued '+q+' to this bill','warn');
      if(q>0)DB.stockMoves.push({id:uid(),date:CART.date,itemId:it.id,type:'out',qty:q,rate:it.rate||0,
        ref:'Bill '+docs[0].no,note:'dispensed',auto:true,billId:docs[0].id});}}});
  /* auto-issue stock from the service → item recipe */
  const used=[];
  CART.lines.forEach(l=>{const s=svcById(l.sid);
    (s&&s.consumes||[]).forEach(c=>{
      const it=DB.stockItems.find(i=>i.id===c.itemId);if(!it)return;
      const q=R(l.qty*(c.qty||1));
      DB.stockMoves.push({id:uid(),date:CART.date,itemId:c.itemId,type:'out',qty:q,rate:it.rate||0,
        ref:'Bill '+docs[0].no,note:l.name,auto:true,billId:docs[0].id});
      used.push(it.name+' ×'+q);});});
  logAct('create','bill','Bill '+docs[0].no+' — '+docs[0].pname+' ('+CART.lines.map(l=>l.name).join(', ')+')',
    sum(docs,d=>d.net),docs[0].id);
  save();
  if(used.length)setTimeout(()=>toast('Stock deducted: '+used.join(', ')),900);
  const short=[];
  CART.lines.forEach(l=>{const s=svcById(l.sid);(s&&s.consumes||[]).forEach(c=>{
    const it=DB.stockItems.find(i=>i.id===c.itemId);
    if(it&&stockQty(it.id)<0&&short.indexOf(it.name)<0)short.push(it.name);});});
  if(short.length)setTimeout(()=>toast('Stock has gone negative: '+short.join(', ')+' — enter the purchase','warn'),1700);
  const ids=docs.map(d=>d.id);
  resetCart();
  toast('Bill '+docs[0].no+' saved','ok');
  if(doPrint)printBills(ids);
}

function stockQty(id){
  const it=DB.stockItems.find(i=>i.id===id);if(!it)return 0;
  let q=Number(it.opening)||0;
  DB.stockMoves.filter(m=>m.itemId===id).forEach(m=>{
    if(m.type==='in')q+=Number(m.qty)||0;
    else if(m.type==='out')q-=Number(m.qty)||0;
    else q=Number(m.qty)||0;
  });
  return R(q);
}

       ['Rent — clinic premises','Salaries — staff','Electricity & water','Medical consumables & drugs','Biomedical waste (IMAGE/KSPCB)','Printing & stationery']
        .map(h=>'<button class="btn ghost sm" style="margin:0 5px 6px 0" onclick="expForm(null,\''+h.replace(/'/g,"\\'")+'\')">'+esc(h)+'</button>').join('')+

function expForm(id,presetHead){
  if(id&&!isOwner()){toast('Entries cannot be changed once saved. Tell the owner.','warn');return;}
  const e=id?DB.expenses.find(x=>x.id===id):null;
  const heads=HEADNAMES.slice();
  modal(e?'Edit expense':'Add expense',
   '<div class="grid g2">'+
    '<div class="f"><label>Date</label><input type="date" id="ex_d" value="'+(e?e.date:today())+'"></div>'+
    '<div class="f"><label>Amount ₹</label><input type="number" id="ex_a" value="'+(e?e.amount:'')+'" placeholder="0"></div>'+
    '<div class="f" style="grid-column:1/-1"><label>What is this for? (head of account)</label>'+
      '<select id="ex_h">'+opt(heads,e?e.head:(presetHead||''))+'<option value="__capex">— it is a SETUP / EQUIPMENT purchase (one-time) —</option></select></div>'+
    '<div class="f" id="ex_capexwrap" style="grid-column:1/-1;display:none"><label>Setup head</label>'+
      '<select id="ex_ch">'+opt(CAPEX_HEADS.map(c=>c[0]),e?e.head:'')+'</select>'+
      '<div class="hint">Setup and equipment spends are <b>not</b> expenses for tax — they become assets and are written off a little every year. This app does that for you.</div></div>'+
    '<div class="f" style="grid-column:1/-1"><label>Details</label><input type="text" id="ex_ds" value="'+esc(e?e.desc:'')+'" placeholder="e.g. Aluminium partition — 2nd instalment"></div>'+
    '<div class="f"><label>Paid to</label><input type="text" id="ex_v" value="'+esc(e?e.vendor:'')+'" list="vlist" placeholder="Vendor / person"><datalist id="vlist">'+
      DB.vendors.map(v=>'<option value="'+esc(v.name)+'">').join('')+'</datalist></div>'+
    '<div class="f"><label>Paid by</label><select id="ex_m">'+opt(MODES,e?e.mode:'UPI')+'</select></div>'+
    '<div class="f"><label>Reference (UPI ref / cheque no)</label><input type="text" id="ex_r" value="'+esc(e?e.ref:'')+'"></div>'+
    '<div class="f"><label>Bill / invoice kept?</label><select id="ex_b"><option value="1"'+(!e||e.billOnFile?' selected':'')+'>Yes — filed</option><option value="0"'+(e&&!e.billOnFile?' selected':'')+'>No bill (voucher only)</option></select></div>'+
   '</div>'+
   '<div id="ex_warn"></div>',
   (e?'<button class="btn danger" id="ex_del">Delete</button>':'')+
   '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="ex_ok">Save</button>');
  const sync=()=>{
    const cap=$('#ex_h').value==='__capex';
    $('#ex_capexwrap').style.display=cap?'block':'none';
    const amt=R($('#ex_a').value),mode=$('#ex_m').value;
    $('#ex_warn').innerHTML=(mode==='Cash'&&amt>=DB.settings.cashLimitExp)?
      '<div class="alert e"><span>⚠</span><div>Cash payment of ₹10,000 or more to one person in a day is <b>disallowed</b> as an expense under income-tax law. Pay by UPI / bank transfer instead, or split it legitimately across days.</div></div>':'';
  };
  if(e&&e.capex){$('#ex_h').value='__capex';}
  $('#ex_h').onchange=sync;$('#ex_a').oninput=sync;$('#ex_m').onchange=sync;sync();
  if(e)$('#ex_del').onclick=()=>{confirmBox('Delete this expense?','It will be removed from the books.',()=>{
    DB.expenses=DB.expenses.filter(x=>x.id!==id);save();closeModal();refresh();toast('Deleted','warn');},'Delete',true);};
  $('#ex_ok').onclick=()=>{
    const amt=R($('#ex_a').value);if(!amt){toast('Enter the amount','warn');return;}
    const cap=$('#ex_h').value==='__capex';
    const head=cap?$('#ex_ch').value:$('#ex_h').value;
    if(!head){toast('Choose what it is for','warn');return;}
    const o={date:$('#ex_d').value,amount:amt,head:head,desc:$('#ex_ds').value.trim(),
      vendor:$('#ex_v').value.trim(),mode:$('#ex_m').value,ref:$('#ex_r').value.trim(),
      billOnFile:$('#ex_b').value==='1',capex:cap};
    if(o.vendor&&!DB.vendors.find(v=>v.name.toLowerCase()===o.vendor.toLowerCase()))
      DB.vendors.push({id:uid(),name:o.vendor});
    if(e){logAct('edit','expense','Edited expense '+e.vno+' — '+head+' '+money(amt),amt,e.id);Object.assign(e,o);}
    else{o.id=uid();o.vno=nextNo('VCH');DB.expenses.push(o);
      logAct('create','expense',head+' — '+money(amt)+' to '+(o.vendor||'—')+' by '+o.mode+(o.desc?' ('+o.desc+')':''),amt,o.id);
      if(cap){const blk=(CAPEX_HEADS.find(c=>c[0]===head)||['','F10'])[1];
        DB.assets.push({id:uid(),name:o.desc||head,head:head,block:blk,cost:amt,date:o.date,
          inService:o.date,vendor:o.vendor,expId:o.id});}}
    save();closeModal();refresh();toast('Saved','ok');
  };
}
function exportExpenses(){
  const rows=[['Date','Voucher','Head','Type','Details','Paid to','Mode','Reference','Bill on file','Amount']];
  DB.expenses.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>rows.push([dmy(e.date),e.vno,e.head,
    e.capex?'Capital / setup':'Revenue',e.desc,e.vendor,e.mode,e.ref,e.billOnFile?'Yes':'No',e.amount]));
  csv(rows,'DCOC_Expenses_'+DB.settings.fy+'.csv');
}

function usedByServices(itemId){
  return DB.services.filter(s=>(s.consumes||[]).some(c=>c.itemId===itemId));
}
VIEWS.stock=function(){
  const t=VIEWS.stock.t||'stock';
  const items=DB.stockItems.slice();
  const val=sum(items,i=>stockQty(i.id)*(i.rate||0));
  const moves=DB.stockMoves.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,150);
  const unlinked=items.filter(i=>!usedByServices(i.id).length);
  let body='';
  if(t==='stock'){
    body='<div class="grid split">'+
   '<div class="card pad"><h3>Current stock</h3>'+
     '<div class="tw"><table><thead><tr><th>Item</th><th>Auto-deducted by</th><th class="num">In stock</th><th class="num">Rate</th><th class="num">Value</th><th></th></tr></thead><tbody>'+
     items.map(i=>{const q=stockQty(i.id),low=(i.min||0)>0&&q<=i.min,us=usedByServices(i.id);
       return '<tr><td><b>'+esc(i.name)+'</b>'+(low?' <span class="chip bad">low</span>':'')+(q<0?' <span class="chip bad">negative</span>':'')+
       '<div class="hint">'+esc(i.cat||'')+'</div></td>'+
       '<td style="font-size:12px;color:var(--ink2);max-width:210px">'+(us.length?esc(us.map(s=>s.name).join(', ')).slice(0,90):'<span class="chip warn">manual only</span>')+'</td>'+
       '<td class="num"><b style="'+(q<0?'color:var(--bad)':'')+'">'+q+'</b> '+esc(i.unit||'')+'</td><td class="num">'+money0(i.rate)+'</td>'+
       '<td class="num">'+money0(q*(i.rate||0))+'</td>'+
       '<td style="white-space:nowrap"><button class="btn sm ghost" onclick="moveForm(\''+i.id+'\',\'in\')">Add</button> '+
       '<button class="btn sm ghost" onclick="moveForm(\''+i.id+'\',\'out\')">Waste</button>'+
       (isOwner()?' <button class="btn sm ghost" onclick="itemForm(\''+i.id+'\')">Edit</button>':'')+'</td></tr>';}).join('')+
     '<tr><td colspan="4" class="num"><b>Closing stock value</b></td><td class="num"><b>'+money(val)+'</b></td><td></td></tr>'+
     '</tbody></table></div></div>'+
   '<div class="card pad"><h3>Movement — where every unit went</h3>'+
     tableOf(['Date','Item','In/Out','Qty','Reason'],moves.map(m=>{const i=DB.stockItems.find(x=>x.id===m.itemId)||{};
       return[dmy(m.date),esc(i.name||'?'),m.type==='in'?'<span class="chip ok">IN</span>':(m.type==='out'?'<span class="chip warn">OUT</span>':'<span class="chip">ADJ</span>'),
       m.qty,(m.auto?'<span class="chip info">auto</span> ':'')+esc(m.ref||m.note||'')+(isOwner()?' <button class="btn sm ghost" onclick="delMove(\''+m.id+'\')">✕</button>':'')];}),'No movement yet')+'</div></div>';
  }else if(t==='pl'){
    const plp=VIEWS.stock.plp||'month';
    const fyr=fyRange(DB.settings.fy);
    const rng=plp==='month'?[today().slice(0,8)+'01',today()]:(plp==='fy'?[fyr[0],fyr[1]]:['2000-01-01',today()]);
    const inR=d=>d>=rng[0]&&d<=rng[1];
    const mv=DB.stockMoves.filter(m=>inR(m.date));
    const inQ={},inC={},soldQ={},soldC={},outQ={},outC={};
    mv.forEach(m=>{
      if(m.type==='in'){inQ[m.itemId]=(inQ[m.itemId]||0)+m.qty;inC[m.itemId]=(inC[m.itemId]||0)+m.qty*(m.rate||0);}
      else if(m.type==='out'){
        if(m.billId){soldQ[m.itemId]=(soldQ[m.itemId]||0)+m.qty;soldC[m.itemId]=(soldC[m.itemId]||0)+m.qty*(m.rate||0);}
        else{outQ[m.itemId]=(outQ[m.itemId]||0)+m.qty;outC[m.itemId]=(outC[m.itemId]||0)+m.qty*(m.rate||0);}}});
    const rev={};
    billsIn(rng[0],rng[1]).forEach(b=>{

    const tPc=R(sum(rows,r=>r.pc)),tSc=R(sum(rows,r=>r.c)),tR=R(sum(rows,r=>r.r)),tOc=R(sum(rows,r=>r.oc)),tPl=R(tR-tSc);
    const tPq=R(sum(rows,r=>r.pq)),tSq=R(sum(rows,r=>r.s2)),tOq=R(sum(rows,r=>r.oq));
    body='<div class="filterbar">'+
      [['month','This month'],['fy','This FY'],['all','All time']].map(x=>'<span class="pill'+(plp===x[0]?' on':'')+'" onclick="VIEWS.stock.plp=\''+x[0]+'\';refresh()">'+x[1]+'</span>').join('')+'</div>'+
     '<div class="grid g4" style="margin-bottom:14px">'+
      '<div class="kpi"><div class="l">Purchases (period)</div><div class="v">'+money0(tPc)+'</div><div class="d">'+tPq+' units purchased</div></div>'+
      '<div class="kpi"><div class="l">Sales — pharmacy &amp; goods</div><div class="v">'+money0(tR)+'</div><div class="d">charged on bills in period</div></div>'+
      '<div class="kpi"><div class="l">Cost of sales</div><div class="v">'+money0(tSc)+'</div><div class="d">'+tSq+' units issued to bills</div></div>'+
      '<div class="kpi acc"><div class="l">Stock P&amp;L</div><div class="v" style="color:'+(tPl>=0?'var(--ok)':'var(--bad)')+'">'+money0(tPl)+'</div><div class="d">sales − cost of sales</div></div>'+
     '</div>'+
     '<div class="grid g2" style="margin-bottom:14px">'+
      '<div class="kpi"><div class="l">Wastage / other issues</div><div class="v">'+money0(tOc)+'</div><div class="d">'+tOq+' units · never sold</div></div>'+
      '<div class="kpi"><div class="l">Closing stock value</div><div class="v">'+money0(val)+'</div><div class="d">at last purchase rate</div></div>'+
     '</div>'+
     '<div class="card pad"><h3>Item-wise — '+esc(rng[0])+' to '+esc(rng[1])+'</h3>'+
     '<div class="tw"><table><thead><tr><th>Item</th><th class="num">Purchased</th><th class="num">Cost ₹</th><th class="num">Sold / given</th><th class="num">Sales ₹</th><th class="num">Cost of sales ₹</th><th class="num">P&amp;L ₹</th><th class="num">Other out</th><th class="num">In stock</th></tr></thead><tbody>'+
     rows.map(r=>'<tr><td><b>'+esc(r.i.name)+'</b><div class="hint">'+esc(r.i.cat||'')+'</div></td>'+
       '<td class="num">'+r.pq+'</td><td class="num">'+money0(r.pc)+'</td>'+
       '<td class="num">'+r.s2+'</td><td class="num">'+money0(r.r)+'</td><td class="num">'+money0(r.c)+'</td>'+
       '<td class="num"><b style="color:'+((r.r||r.c)?(r.pl>=0?'var(--ok)':'var(--bad)'):'var(--ink3)')+'">'+((r.r||r.c)?money0(r.pl):'—')+'</b></td>'+
       '<td class="num">'+(r.oq?(r.oq+' <span class="chip warn">waste</span>'):'—')+'</td>'+
       '<td class="num"><b'+(r.sq<0?' style="color:var(--bad)"':'')+'>'+r.sq+'</b> '+esc(r.i.unit||'')+'</td></tr>').join('')+
     '<tr><td><b>Total</b></td><td class="num">'+tPq+'</td><td class="num"><b>'+money0(tPc)+'</b></td><td class="num">'+tSq+'</td>'+
       '<td class="num"><b>'+money0(tR)+'</b></td><td class="num"><b>'+money0(tSc)+'</b></td><td class="num"><b style="color:'+(tPl>=0?'var(--ok)':'var(--bad)')+'">'+money0(tPl)+'</b></td>'+

     '<div class="hint" style="margin-top:8px">Sales = dispensed medicines and rate-card goods charged on bills in the period. Consumables used inside procedures (PRP kits, plasters, syringes) show <b>cost only</b> — their income is part of the procedure price, so their P&amp;L column stays “—”. Dispensed medicines are billed at cost + 20% unless the front desk edits the rate.</div></div>';
  }else{
    body='<div class="alert '+(unlinked.length?'w':'s')+'"><span>●</span><div>'+
      (unlinked.length?'<b>'+unlinked.length+' item'+(unlinked.length>1?'s are':' is')+' not linked to any service</b> — '+esc(unlinked.map(i=>i.name).join(', '))+
        '. Those will only move when someone records it by hand. Link them below and they take care of themselves.'
       :'Every stock item is linked to at least one service. Nothing needs manual counting.')+'</div></div>'+
    '<div class="card pad"><h3>Recipes — what each service eats</h3>'+

/* ================= ASSETS & DEPRECIATION ================= */
function depFor(a,fy){
  const [s,e]=fyRange(fy);const rate=BLOCKS[a.block].r;
  if(a.inService>e)return{open:0,add:0,dep:0,close:0,half:false};
  const bought=inRange(a.inService,s,e);
  let wdv=Number(a.cost)||0;
  /* roll forward from purchase year to requested fy */
  let y=+fyOf(a.inService).split('-')[0], target=+fy.split('-')[0];
  let openWdv=0,add=0,dep=0,half=false;
  if(bought){
    const days=(new Date(e)-new Date(a.inService))/864e5;
    half=days<180;add=wdv;openWdv=0;dep=R(wdv*rate/100*(half?0.5:1));
  }else{
    let cur=wdv;const firstDays=(new Date(fyRange(fyOf(a.inService))[1])-new Date(a.inService))/864e5;
    cur=R(cur-cur*rate/100*(firstDays<180?0.5:1));
    for(let k=y+1;k<target;k++)cur=R(cur-cur*rate/100);
    openWdv=cur;dep=R(cur*rate/100);
  }
  return{open:R(openWdv),add:R(add),dep:dep,close:R(openWdv+add-dep),half:half,rate:rate};
}

  const v=visitById(CV);const M=v.meds||[];

  $('#rxrows').innerHTML=M.length?M.map((m,i)=>'<tr>'+
    '<td style="width:34%"><input type="text" list="medlist" value="'+esc(m.name)+'" placeholder="Medicine" oninput="rxSet('+i+',\'name\',this.value)"></td>'+

    (function(){const it=DB.stockItems.find(function(x){return x.id===m.itemId;})||DB.stockItems.find(function(x){return x.name&&x.name.toLowerCase()===String(m.name||'').toLowerCase();});

    :'<tr><td class="hint">No medicines written.</td></tr>';

function rxSet(i,k,val){const v=visitById(CV);v.meds[i][k]=val;
  if(k==='name'){
    const it=DB.stockItems.find(x=>x.name.toLowerCase()===String(val).toLowerCase());
    if(it){
      const q=stockQty(it.id);
      if(q<=0){toast(it.name+' — not in stock ('+q+' '+(it.unit||'pcs')+' in clinic). Buy it first, or write it as an outside medicine.','bad');
        v.meds[i].name='';v.meds[i].itemId='';save();drawRx();return;}
      toast(it.name+': '+q+' '+(it.unit||'pcs')+' in stock','ok');
    }
    v.meds[i].itemId=it?it.id:'';
  }
  if(k==='qty'&&v.meds[i].dispense&&v.meds[i].itemId){
    const it2=DB.stockItems.find(x=>x.id===v.meds[i].itemId);
    if(it2){const q2=stockQty(it2.id);
      if((+val||0)>q2){v.meds[i].qty=q2;save();drawRx();
        toast('Only '+q2+' '+(it2.unit||'pcs')+' of '+it2.name+' in stock — quantity capped','warn');return;}}}
  if(k==='dispense'&&val&&v.meds[i].itemId){
    const it3=DB.stockItems.find(x=>x.id===v.meds[i].itemId);
    if(it3){const q3=stockQty(it3.id);
      if(q3<=0){v.meds[i].dispense=false;save();drawRx();
        toast(it3.name+' — not in stock ('+q3+' in clinic). "Give from clinic" unticked.','bad');return;}
      if((v.meds[i].qty||0)>q3){v.meds[i].qty=q3;save();drawRx();
        toast('Only '+q3+' '+(it3.unit||'pcs')+' in stock — quantity capped','warn');return;}}}
  save();}
function saveConsult(quiet){
  const v=visitById(CV);if(!v)return;
  v.complaint=$('#cs_c')?$('#cs_c').value:v.complaint;
  v.findings=$('#cs_f')?$('#cs_f').value:v.findings;

  v.advice=$('#cs_a')?$('#cs_a').value:v.advice;
  v.followUp=$('#cs_fu')?$('#cs_fu').value:v.followUp;

function billVisit(id){
  const v=visitById(id),p=patById(v.patientId);
  CART={pid:p.id,pname:p.name,pphone:p.phone||'',lines:[],disc:0,discMode:'rs',discPct:0,discReason:'',date:today(),note:'',pay:[],
    visitId:v.id,doctorId:v.doctorId};
  /* consultation fee by visit type */
  const cons=DB.services.find(s=>s.code===(v.type==='Review'?'C02':'C01'));
  if(cons&&(v.type==='New'||v.type==='Review'))
    CART.lines.push({sid:cons.id,code:cons.code,name:cons.name,ml:cons.ml,hsn:cons.hsn,tax:cons.tax,qty:1,rate:cons.price,over:''});
  (v.procedures||[]).forEach(l=>{const s=svcById(l.sid);if(!s)return;
    CART.lines.push({sid:s.id,code:s.code,name:s.name,ml:s.ml,hsn:s.hsn,tax:s.tax,qty:l.qty,rate:l.rate,over:''});});
  (v.meds||[]).filter(m=>m.dispense&&m.name).forEach(m=>{
    const it=DB.stockItems.find(i=>i.id===m.itemId)||DB.stockItems.find(i=>i.name.toLowerCase()===m.name.toLowerCase());
    CART.lines.push({sid:'',code:'MED',name:m.name+(m.dose?' ('+m.dose+')':''),ml:'',hsn:'3004',
      tax:DB.settings.gstEnabled?'gst5':'exempt',qty:m.qty||1,rate:it?R(it.rate*1.2):0,over:'',medItemId:it?it.id:''});});
  CART.note=v.diagnosis||'';
  go('bill');
  setTimeout(()=>toast('Loaded from '+(docById(v.doctorId).name||'the doctor')+' — check the prices and take payment'),400);
}

    logAct(d?'edit':'create','doctor',(d?'Updated ':'Added ')+(o.kind==='physio'?'physiotherapist ':'doctor ')+o.name,0,d?d.id:o.id);

function nameTaken(u,exceptId){
  u=String(u).toUpperCase();
  if(u===String(DB.settings.ownerUser).toUpperCase())return true;
  if((DB.doctors||[]).some(d=>d.id!==exceptId&&d.login&&String(d.user).toUpperCase()===u))return true;
  if((DB.staff||[]).some(s=>s.id!==exceptId&&s.login&&String(s.user).toUpperCase()===u))return true;
  return false;
}

function genPayrun(m){

    const old=run&&run.rows.find(r=>r.staffId===s.id);
    return old||{staffId:s.id,base:s.salary,allow:0,advance:0,deduct:0,pt:Math.round(ptFor(s.salary)/6),
      net:R(s.salary-Math.round(ptFor(s.salary)/6)),paid:false,mode:'Bank transfer',date:''};});
  if(run)run.rows=rows;else{run={id:uid(),month:m,rows:rows};DB.payruns.push(run);}

function inWords(n){
  n=Math.round(Number(n)||0);
  if(!n)return'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const seg=(x,l)=>x?two(x)+' '+l+' ':'';
  let s='';
  s+=seg(Math.floor(n/10000000),'Crore');n%=10000000;
  s+=seg(Math.floor(n/100000),'Lakh');n%=100000;
  s+=seg(Math.floor(n/1000),'Thousand');n%=1000;
  s+=seg(Math.floor(n/100),'Hundred');n%=100;
  if(n)s+=two(n);
  return s.trim();
}

function exportCashbook(){
  const [a,b]=fyRange(DB.settings.fy);
  const rows=[['CASH & BANK BOOK'],[DB.settings.clinicName],['FY',DB.settings.fy],[],
    ['Date','Particulars','Mode','Received','Paid','Cash balance','Bank balance']];
  const st=fyStats(DB.settings.fy);const list=[];
  st.rc.forEach(r=>list.push({d:r.d,p:'Receipt — '+r.bill.pname+' ('+r.bill.no+')',in:r.amt,out:0,m:r.mode}));
  st.ex.forEach(e=>list.push({d:e.date,p:e.head+(e.desc?' — '+e.desc:''),in:0,out:Number(e.amount),m:e.mode}));
  list.sort((x,y)=>x.d<y.d?-1:1);
  let cb=Number(DB.settings.openingCash)||0,bb=Number(DB.settings.openingBank)||0;
  rows.push([dmy(DB.settings.openingDate),'Opening balance','',,'',cb,bb]);
  list.forEach(r=>{if(r.m==='Cash')cb+=r.in-r.out;else bb+=r.in-r.out;
    rows.push([dmy(r.d),r.p,r.m,r.in||'',r.out||'',R(cb),R(bb)]);});
  csv(rows,'DCOC_CashBook_'+DB.settings.fy+'.csv');
}

function restore(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.settings||!d.bills)throw 0;
    confirmBox('Restore this backup?','Everything currently in the app will be replaced by the file <b>'+esc(f.name)+'</b>.',
      ()=>{DB=d;migrate();saveNow();refresh();toast('Restored','ok');},'Replace everything',true);
  }catch(e){toast('That file is not a valid backup','bad');}};
  r.readAsText(f);
}

  if(f==='staff')list=list.filter(l=>l.role!=='owner');

  actions:(un?'<button class="btn gold" onclick="markAllSeen()">Mark all as seen</button>':'')+

  html:'<div class="alert i"><span>●</span><div>Every bill, expense, purchase and price change is stamped with who did it and when. Staff cannot edit or erase anything after saving — <b>you</b> undo it from here.</div></div>'+
  '<div class="card pad">'+

   (list.length?'<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th class="num">Amount</th><th></th></tr></thead><tbody>'+
    list.slice(0,500).map(l=>{const A=ACTLABEL[l.act]||['Did','info'];
      return '<tr'+(l.seen?'':' style="background:#FFFCF2"')+'><td style="white-space:nowrap;font-size:12.5px">'+dmy(l.ts.slice(0,10))+
        '<div class="hint">'+l.ts.slice(11,16)+'</div></td>'+
      '<td>'+esc(l.uname)+(l.role==='owner'?' <span class="chip">you</span>':'')+'</td>'+
      '<td>'+(l.ent==='session'?'<span class="chip">Sign in</span>':'<span class="chip '+A[1]+'">'+A[0]+'</span> '+esc(l.summary))+'</td>'+
      '<td class="num">'+(l.amount?money(l.amount):'')+'</td>'+
      '<td style="white-space:nowrap">'+(l.seen?'':'<button class="btn sm ghost" onclick="seeOne(\''+l.id+'\')">Seen</button> ')+
      (['bill','expense','purchase','stock'].indexOf(l.ent)>=0&&l.act!=='cancel'&&l.act!=='delete'?
        '<button class="btn sm ghost" onclick="undoEntry(\''+l.id+'\')">Undo</button>':'')+'</td></tr>';}).join('')+
    '</tbody></table></div>':'<div class="empty"><div class="big">✓</div>Nothing to review</div>')+
  '</div>'};
};
function seeOne(id){const l=DB.log.find(x=>x.id===id);if(l)l.seen=true;save();refresh();}
function markAllSeen(){(DB.log||[]).forEach(l=>l.seen=true);save();refresh();toast('All reviewed','ok');}
function undoEntry(logId){
  const l=DB.log.find(x=>x.id===logId);if(!l)return;
  const what=l.ent==='bill'?'The bill will be marked CANCELLED (a numbered bill cannot legally be deleted) and any stock it used goes back.'
    :'The entry will be deleted from the books.';
  confirmBox('Undo this entry?','<b>'+esc(l.summary)+'</b><br><br>'+what,()=>{
    if(l.ent==='bill'){const b=DB.bills.find(x=>x.id===l.targetId);
      if(b&&!b.cancelled){b.cancelled=true;b.cancelReason='Reversed by owner';b.cancelDate=today();
        DB.stockMoves.filter(m=>m.billId===b.id&&m.type==='out'&&m.auto).forEach(m=>
          DB.stockMoves.push({id:uid(),date:today(),itemId:m.itemId,type:'in',qty:m.qty,rate:m.rate,
            ref:'Reversal — bill '+b.no+' cancelled',auto:true}));}}
    else if(l.ent==='expense'){DB.expenses=DB.expenses.filter(x=>x.id!==l.targetId);
      DB.assets=DB.assets.filter(a=>a.expId!==l.targetId);}
    else if(l.ent==='purchase'||l.ent==='stock'){
      const mv=DB.stockMoves.filter(m=>m.itemId===l.targetId).sort((a,b)=>a.date<b.date?1:-1)[0];
      if(mv)DB.stockMoves=DB.stockMoves.filter(m=>m.id!==mv.id);
      const ex=DB.expenses.slice().reverse().find(e=>e.amount===l.amount&&!e.capex);
      if(l.ent==='purchase'&&ex)DB.expenses=DB.expenses.filter(x=>x.id!==ex.id);}
    l.seen=true;l.undone=true;
    logAct('delete',l.ent,'Reversed: '+l.summary,l.amount,l.targetId);
    save();refresh();toast('Reversed','warn');},'Undo it',true);
}
function exportLog(){
  const rows=[['ACTIVITY LOG'],[DB.settings.clinicName],[],['Date','Time','User','Role','Action','Area','Details','Amount','Reviewed']];
  (DB.log||[]).forEach(l=>rows.push([dmy(l.ts.slice(0,10)),l.ts.slice(11,16),l.uname,l.role,l.act,l.ent,l.summary,l.amount,l.seen?'Yes':'No']));
  csv(rows,'DCOC_ActivityLog.csv');
}

/* ================= SIGN IN ================= */
function allUsers(){
  const u=[{id:'owner',name:DB.settings.ownerName||'Owner',role:'owner',
    user:DB.settings.ownerUser,pass:DB.settings.ownerPass,perms:null}];
  (DB.doctors||[]).filter(d=>d.login&&d.active!==false&&d.user).forEach(d=>
    u.push({id:d.id,name:d.name,role:'doctor',kind:d.kind||'doctor',user:d.user,pass:d.pass,
      perms:Object.assign({},(d.kind==='physio'?PHYSIO_PERMS:DOCTOR_PERMS),d.perms||{}),
      sub:d.spec||(d.kind==='physio'?'Physiotherapist':'Doctor')}));
  (DB.staff||[]).filter(x=>x.login&&x.active!==false&&x.user).forEach(x=>
    u.push({id:x.id,name:x.name,role:'staff',user:x.user,pass:x.pass,
      perms:Object.assign({},DEFAULT_PERMS,x.perms||{}),sub:x.role||'Staff'}));
  return u;
}
function lockScreen(){
  const dflt=(DB.settings.ownerUser==='DCORTHO'&&DB.settings.ownerPass==='DC@1234');
  const d=document.createElement('div');d.className='lock';d.id='lockscr';
  d.innerHTML='<div class="logochip" style="max-width:250px;margin-bottom:12px"><img src="'+LOGO+'" style="width:100%"></div>'+
    '<div class="signbox">'+
      '<div class="f"><label class="lk">Username</label>'+
        '<input type="text" id="uin" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="username"></div>'+
      '<div class="f" style="margin-bottom:6px"><label class="lk">Password</label>'+
        '<div class="pwrap"><input type="password" id="pin" autocomplete="current-password">'+
        '<button type="button" class="eyebtn" id="eye">Show</button></div></div>'+
      '<div id="capswarn" class="capsw"></div>'+
      '<button class="btn gold lg" id="signin" style="width:100%;justify-content:center;margin-top:8px">Sign in</button>'+
      '<div id="pinerr" class="lkerr"></div>'+
      '<div class="firsttime">Sign in with your clinic account.<br>If you forgot it, ask the admin.</div>'+
    '</div>'+
    '<div class="lkfoot">DC Ortho Care · Books &amp; Billing · v'+APP_VERSION+'<br>Data is stored centrally · PostgreSQL.</div>';
  document.body.appendChild(d);
  let shown=false;
  $('#eye').onclick=()=>{shown=!shown;$('#pin').type=shown?'text':'password';
    $('#eye').textContent=shown?'Hide':'Show';$('#pin').focus();};

  const caps=e=>{const on=e.getModifierState&&e.getModifierState('CapsLock');
    $('#capswarn').textContent=on?'Caps Lock is on':'';};
  $('#pin').onkeyup=caps;$('#uin').onkeyup=caps;
  const tryIn=()=>{
    const u=String($('#uin').value||'').trim().toUpperCase(), pw=String($('#pin').value||'').trim();
    if(!u&&!pw){$('#pinerr').textContent='Type the username and password';return;}
    const hit=allUsers().find(x=>String(x.user||'').trim().toUpperCase()===u&&String(x.pass||'').trim()===pw);
    if(!hit){
      const userOk=allUsers().some(x=>String(x.user||'').trim().toUpperCase()===u);
      $('#pinerr').textContent=userOk?'That password is wrong':'No such username on this device';
      $('#pin').value='';$('#pin').focus();return;}
    USER={id:hit.id,name:hit.name,role:hit.role,kind:hit.kind||'',perms:hit.perms};
    if(hit.role!=='owner'){logAct('create','session','Signed in',0,hit.id);save();}
    d.remove();boot2();
  };
  $('#signin').onclick=tryIn;
  $('#pin').onkeydown=e=>{if(e.key==='Enter')tryIn();};
  $('#uin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#pin').focus();}};
  setTimeout(()=>$('#uin').focus(),120);
}

/* ================= BOOT ================= */
function boot(){
  load();
  pullCloud();
  const na=window.__NA_USER__;
  if(na&&na.username){autoLogin(na);return;}
  if(DB.settings.pinLock!==false)lockScreen();
  else{USER={id:'owner',name:DB.settings.ownerName||'Owner',role:'owner',perms:null};boot2();}
}
function boot2(){window.__IN__=true;
  const h=(location.hash||'').replace('#','');
  CUR=(h&&VIEWS[h]&&(h==='dash'||(h==='activity'?isOwner():can(h))))?h:'dash';
  nav();go(CUR);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeModal();
    if(e.altKey&&e.key==='n'){e.preventDefault();go('bill');}
    if(e.altKey&&e.key==='e'){e.preventDefault();go('expenses');}
  });
  window.addEventListener('beforeunload',function(){window.__BEACON__=true;saveNow();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){window.__BEACON__=true;saveNow();}});
}
/* ===== server sync bridge (PostgreSQL) ===== */
window.__CLOUD_READY__=false;window.__CLOUD_DIRTY__=false;
function cloudStatus(txt){const f=document.querySelector('#side .foot');if(f)f.innerHTML=txt;}
function cloudPush(){
  if(!window.__CLOUD_READY__){window.__CLOUD_DIRTY__=true;return;}
  try{
    const body=JSON.stringify({doc:DB});
    const done=function(){window.__CLOUD_FAILS=0;window.__CLOUD_DIRTY__=false;
      cloudStatus('Saved to server · '+new Date().toTimeString().slice(0,5)+'<br>Take a backup every Friday.');};
    if(window.__BEACON__&&navigator.sendBeacon){navigator.sendBeacon('/api/state',new Blob([body],{type:'application/json'}));window.__BEACON__=false;done();return;}
    fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:body,keepalive:true})
      .then(function(r){if(!r.ok)throw 0;done();})
      .catch(function(){
        window.__CLOUD_FAILS=(window.__CLOUD_FAILS||0)+1;
        if(window.__CLOUD_FAILS===1)toast('Could not reach the server — your work is safe on this device and will sync automatically.','warn');
        cloudStatus('Offline — changes kept on this device,<br>will sync automatically.');
        window.__CLOUD_DIRTY__=true;
        setTimeout(function(){if(window.__CLOUD_DIRTY__&&window.__CLOUD_READY__)cloudPush();},5000);});
  }catch(e){}
}
function pullCloud(){
  fetch('/api/state').then(r=>r.ok?r.json():null).then(j=>{
    if(j&&j.doc&&j.doc.settings){DB=j.doc;migrate();
      try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
    window.__CLOUD_READY__=true;
    cloudStatus('Connected · central PostgreSQL<br>Take a backup every Friday.');
    if(window.__CLOUD_DIRTY__){window.__CLOUD_DIRTY__=false;cloudPush();}
    if(window.__IN__){try{nav();go(CUR);}catch(e){}}
  }).catch(()=>{window.__CLOUD_READY__=true;
    if(window.__CLOUD_DIRTY__){window.__CLOUD_DIRTY__=false;cloudPush();}});
}
function autoLogin(na){
  const hit=allUsers().find(x=>String(x.user||'').trim().toUpperCase()===String(na.username).toUpperCase());
  if(hit){USER={id:hit.id,name:hit.name,role:hit.role,kind:hit.kind||'',perms:hit.perms};boot2();return;}
  if(DB.settings.pinLock!==false){lockScreen();return;}
  USER={id:'owner',name:DB.settings.ownerName||'Owner',role:'owner',perms:null};boot2();
}
window.__NA_USER__=__NA_USER_JSON__;
document.addEventListener('DOMContentLoaded',boot);
